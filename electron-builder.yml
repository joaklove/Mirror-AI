appId: com.mirrorai.app
productName: Mirror AI
copyright: Copyright © 2026 Mirror AI

# 构建配置
build:
  # 构建目录
  outputDir: build-electron
  # 清理构建目录
  clean: true
  # 构建目标
  targets:
    nsis: true
    dmg: true
    deb: true
    rpm: true
  # 发布配置
  publish:
    provider: github
    owner: mirror-ai
    repo: mirror-ai-app
    private: false
    releaseType: release

# 文件配置
files:
  - "dist/**/*"
  - "electron/**/*"
  - "public/**/*"
  - "package.json"

# 目录配置
directories:
  buildResources: build-resources
  output: build-electron

# 平台配置
mac:
  category: public.app-category.lifestyle
  icon: public/favicon.ico
  target: [dmg, zip]
  minimumSystemVersion: 10.13

win:
  icon: public/favicon.ico
  target: [nsis, zip]
  publisherName: Mirror AI

linux:
  icon: public/favicon.ico
  target: [deb, rpm, AppImage]
  category: Utility

# NSIS 安装程序配置
nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: public/favicon.ico
  uninstallerIcon: public/favicon.ico
  installerHeaderIcon: public/favicon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mirror AI
  include: build-resources/nsis/include.nsh
  script: build-resources/nsis/installer.nsh

# 应用配置
electronVersion: 20.0.0
electronDownload: {
  mirror: "https://npmmirror.com/mirrors/electron/"
}
